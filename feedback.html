<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1 id="title">Player Survey for Alan Wake 2</h1>

    <p id="description">
      Thank you for taking the time to help us improve the game.
    </p>

    <form id="survey-form" action="save_feedback.php" method="POST">
      <div class="input-elements">
        <label for="name" id="name-label">Name</label>
        <input type="text" id="name" name="name" placeholder="Name" required />
      </div>

      <div class="input-elements">
        <label for="email" id="email-label">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Email"
          required
        />
      </div>

      <div class="input-elements">
        <label for="number" id="number-label">Age</label>
        <input
          type="number"
          id="number"
          name="age"
          placeholder="Age"
          min="17"
          max="120"
          required
        />
      </div>

      <div class="input-elements">
        <label for="dropdown" id="dropdown-label">
          How would you rate the story?
        </label>

        <select id="dropdown" name="story_rating" required>
          <option value="">(select one)</option>
          <option value="1">Captivating and terrifying</option>
          <option value="2">Good and scary</option>
          <option value="3">Okay, I don't scare easily</option>
          <option value="4">Seen better</option>
        </select>
      </div>

      <fieldset>
        <legend>Would you recommend the game to a friend? (required)</legend>

        <label for="yes">
          <input type="radio" id="yes" name="recommend" value="1" required />
          I would
        </label>

        <label for="no">
          <input type="radio" id="no" name="recommend" value="2" />
          I would not
        </label>

        <label for="maybe">
          <input type="radio" id="maybe" name="recommend" value="3" />
          Maybe
        </label>
      </fieldset>

      <fieldset>
        <legend id="improvements-label">
          How would you like us to improve the game?
        </legend>

        <label for="improvement-1">
          <input
            type="checkbox"
            id="improvement-1"
            name="improvements[]"
            value="1"
          />
          Expand on the lore and mysteries introduced in Alan Wake.
        </label>

        <label for="improvement-2">
          <input
            type="checkbox"
            id="improvement-2"
            name="improvements[]"
            value="2"
          />
          Enhance combat mechanics for a more satisfying experience.
        </label>

        <label for="improvement-3">
          <input
            type="checkbox"
            id="improvement-3"
            name="improvements[]"
            value="3"
          />
          Expand the game world with diverse environments.
        </label>
      </fieldset>

      <div class="input-elements">
        <label for="feedback" id="feedback-label">
          You can give us feedback on the game:
        </label>

        <textarea
          id="feedback"
          name="feedback"
          rows="3"
          cols="30"
          placeholder="The game could be improved by..."
        ></textarea>
      </div>

      <input id="submit" type="submit" value="Submit" />
    </form>
  </body>
</html>
